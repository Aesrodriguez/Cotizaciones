services:
  # Backend API — Python FastAPI (Docker)
  - type: web
    name: cotizaciones-api
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: '["https://cotizaciones-web-60nf.onrender.com"]'
      - key: FRONTEND_URL
        value: https://cotizaciones-web-60nf.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: tripleaconstruccionessas@gmail.com
      - key: SMTP_PASSWORD
        sync: false

  # Frontend — React + Vite (sitio estático)
  - type: web
    name: cotizaciones-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://cotizaciones-api-p4qy.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

